<script>
const questions=[{"id": 1, "type": "sort", "prompt": "There are two types of immunity discussed: innate immunity and adaptive immunity. Determine if the following best describes innate immunity or adaptive immunity. (L.O. 31.1, 31.3, 31.39)", "categories": ["Innate Immunity", "Adaptive Immunity"], "items": ["First line of defense", "Natural immunity", "Takes minutes/hours to activate", "Nonspecific immune response", "Lacks memory", "Resistance to any microbe", "Has \"memory\"", "Resistance to a particular foreign agent", "Acquired immunity", "Includes B and T cells", "Specific immune response", "Takes days to activate"], "answer": {"Innate Immunity": ["First line of defense", "Natural immunity", "Takes minutes/hours to activate", "Nonspecific immune response", "Lacks memory", "Resistance to any microbe"], "Adaptive Immunity": ["Has \"memory\"", "Resistance to a particular foreign agent", "Acquired immunity", "Includes B and T cells", "Specific immune response", "Takes days to activate"]}, "explanation": "Innate immunity is rapid, nonspecific, natural, and lacks memory. Adaptive immunity is acquired, specific, slower initially, and has memory.", "learningObjectives": [1, 3, 39], "topic": "Innate versus adaptive immunity"}, {"id": 2, "type": "fill_multi", "prompt": "Part of the innate immune system is the use of physical barriers. These barriers are often part of the first line of defense. (L.O. 31.2, 31.10, 31.12, 31.38)", "parts": [["This includes the skin, which have substances like lysozyme that ", " the bacterial cell wall (specifically the ", " ). There is also the mucous membranes, which are used to lubricate and protect organs and cavities from abrasive particles. They are a bit more prone to infection than the skin due to its role in absorption and secretion, but nevertheless provide a good barrier for the body. Additionally, there is the respiratory system, which makes use of a mucociliary escalator to clear pathogens and particles from the airway. This is important, as the ", " respiratory system must remain clear of microbes. There is also the use of antimicrobial peptides, which are among the most ancient primary defense systems. They are amphipathic, which means that they have ", "."]], "answers": [["break", "β-1,4 glycosidic bonds", "lower", "both hydrophobic and hydrophilic regions"]], "explanation": "Lysozyme breaks β-1,4 glycosidic bonds. The lower respiratory tract should remain clear, and amphipathic peptides have both hydrophobic and hydrophilic regions.", "learningObjectives": [2, 10, 12, 38], "topic": "Physical barriers, lysozyme, mucociliary clearance, and amphipathic peptides"}, {"id": 3, "type": "matching", "prompt": "CAMPs (cationic antimicrobial peptides) are a type of antimicrobial peptide produced by host cells. They play a major role in the innate immune system. Match the following classes of CAMPs to its corresponding characteristic. (L.O. 31.11)", "rows": ["Second class", "Third class", "First class"], "options": ["Defensins, causes pores in cell membrane", "Histatin, peptide found in saliva that has anti-fungal activity", "Cathelicidin, causes membrane disruption"], "answer": [0, 1, 2], "explanation": "The course key maps the first class to cathelicidin, the second class to defensins, and the third class to histatin.", "learningObjectives": [11], "topic": "Classes of cationic antimicrobial peptides"}, {"id": 4, "type": "single", "prompt": "Bacteriocins are a type of antimicrobial peptide that: (L.O. 31.11)", "options": ["Include tetracycline and vancomycin, which come from a Streptomyces spp.", "Are only produced by Gram-negative bacteria", "Are used to kill related species", "Both A & B", "Both A & C"], "answer": 2, "explanation": "Bacteriocins are used to kill closely related species.", "learningObjectives": [11], "topic": "Bacteriocins"}, {"id": 5, "type": "multi", "prompt": "The complement system is an important part of the innate immune system. It is composed of over 30 serum proteins and it has several activities. Determine which of the following statements is TRUE. (Select all that apply) (L.O. 31.5, 31.13, 31.14, 31.38)", "options": ["The complement system includes the combination pathway.", "The complement system includes the alternative pathway.", "The complement system may be used to increase the virulence of pathogenic cells (with complement component C4).", "The complement system includes the acquired pathway.", "The complement system includes the classical pathway.", "The complement system may be used to stimulate the inflammatory response (with complement components C3a and C5a).", "The complement system may be used to kill pathogenic cells (with the Membrane Attack Complex).", "The complement system may be used to opsonize, or coat, the pathogen (with complement component C3b).", "The complement system includes the lectin pathway."], "answer": [1, 4, 5, 6, 7, 8], "explanation": "The three recognized pathways are alternative, classical, and lectin. Complement can promote inflammation, opsonization, and membrane attack complex–mediated killing.", "learningObjectives": [5, 13, 14, 38], "topic": "Complement pathways and outcomes"}, {"id": 6, "type": "multi", "prompt": "It is impossible to talk about the immune system without talking about leukocytes, or white blood cells. These white blood cells are part of innate and adaptive immunity and arise from pluripotent stem cells from the bone marrow. Determine which of the following are leukocytes below. (Select all that apply)", "options": ["Granulocytes", "Red blood cells (erythrocytes)", "Mast cells", "Dendrites", "Monocytes", "Macrophages", "Dendritic cells", "Lymphocytes"], "answer": [0, 2, 4, 5, 6, 7], "explanation": "Granulocytes, mast cells, monocytes, macrophages, dendritic cells, and lymphocytes are leukocytes. Erythrocytes and dendrites are not.", "learningObjectives": [3, 16, 17], "topic": "Types of leukocytes"}, {"id": 7, "type": "tf", "prompt": "This is a very important concept that is easily confused. All lymphocytes are leukocytes, but not all leukocytes are lymphocytes. (L.O. 31.17)", "answer": true, "explanation": "Lymphocytes are one subset of leukocytes.", "learningObjectives": [17], "topic": "Leukocytes versus lymphocytes"}, {"id": 8, "type": "single", "prompt": "Mast cells:", "options": ["Are a type of professional phagocyte", "Are lymphocytes that release vasoactive mediators such as histamine", "Bind to receptors on IgM", "Can contribute to hay fever, allergies, or eczema", "All of the above are true."], "answer": 3, "explanation": "Mast cells contribute to allergic and hypersensitivity reactions, including hay fever and eczema.", "learningObjectives": [3], "topic": "Mast cells"}, {"id": 9, "type": "sort", "prompt": "Granulocytes are an important type of leukocyte (not lymphocytes!) that is characterized by the presence of granules in its cytoplasm. They use these granules to fight infection and inflammation. Match the following types of granulocytes to their corresponding characteristics:", "categories": ["Basophils", "Eosinophils", "Neutrophils"], "items": ["Stain bluish-black with basic dyes", "Found mostly in tissues and play a role in allergies/hypersensitivities", "Stain red with acidic dyes", "Play a role in defending against parasitic infections and allergies/hypersensitivities", "Stain at neutral pH", "Highly phagocytic cells, kills ingested microbes with enzymes and ROS", "Pyogenic (forms pus) at the site of infection"], "answer": {"Basophils": ["Stain bluish-black with basic dyes", "Found mostly in tissues and play a role in allergies/hypersensitivities"], "Eosinophils": ["Stain red with acidic dyes", "Play a role in defending against parasitic infections and allergies/hypersensitivities"], "Neutrophils": ["Stain at neutral pH", "Highly phagocytic cells, kills ingested microbes with enzymes and ROS", "Pyogenic (forms pus) at the site of infection"]}, "explanation": "Basophils stain with basic dyes, eosinophils with acidic dyes, and neutrophils at neutral pH; their immune roles differ accordingly.", "learningObjectives": [3, 16], "topic": "Granulocytes"}, {"id": 10, "type": "sort", "prompt": "Along with neutrophils, monocytes and macrophages are also important in phagocytosis. These are leukocytes, not lymphocytes. Macrophages, for example, are the first to encounter the microbe and send signals to recruit other cells to the site of infection. Determine if the following best describes a monocyte or macrophage. (L.O. 31.39)", "categories": ["Monocytes", "Macrophages"], "items": ["Generally smaller and less developed/differentiated", "Circulate in blood", "Generally larger and more developed/differentiated", "Reside or \"fixed\" in specific tissues"], "answer": {"Monocytes": ["Generally smaller and less developed/differentiated", "Circulate in blood"], "Macrophages": ["Generally larger and more developed/differentiated", "Reside or \"fixed\" in specific tissues"]}, "explanation": "Monocytes circulate in blood and are less differentiated; macrophages are larger, differentiated tissue-resident cells.", "learningObjectives": [16, 39], "topic": "Monocytes versus macrophages"}, {"id": 11, "type": "fill_multi", "prompt": "There are important organs/tissues where lymphocytes go through to help fight infection. (L.O. 31.19, 31.39)", "parts": [["This includes the primary lymphoid tissue, where B and T lymphocytes ", ". The thymus is where ", " ", " while the bone marrow is where ", " ", ". This also includes the secondary lymphoid tissue, where B and T lymphocytes ", " with the help of professional phagocytes such as dendritic cells. Examples of the secondary lymphoid tissue are the spleen, lymph nodes, and MALT."]], "answers": [["mature and differentiate", "T cells", "mature", "B cells", "mature", "encounter the antigen"]], "explanation": "B and T cells mature in primary lymphoid tissues. T cells mature in the thymus, B cells in bone marrow, and both encounter antigens in secondary lymphoid tissues.", "learningObjectives": [19], "topic": "Primary and secondary lymphoid tissues"}, {"id": 12, "type": "fill", "prompt": "M cells (microfold cells) are specialized intestinal epithelium cells that are found in the MALT (mucosal-associated lymphoid tissue). They sample antigens and pathogens from the ______ of the gut lumen. They are neither leukocytes nor lymphocytes. (L.O. 31.20)", "answers": ["top"], "explanation": "The expected course answer is “top.”", "learningObjectives": [20], "topic": "M cells"}, {"id": 13, "type": "single", "prompt": "As previously mentioned, phagocytosis play an important role in the immune system. Professional phagocytes include macrophages, neutrophils, and dendritic cells. This process of ingesting a microbe or pathogen can be further enhanced by opsonization from antibodies and/or complement components. Which of the following best describes the process of opsonization? (L.O. 31.15, 31.21)", "options": ["Complement proteins form a membrane attack complex to lyse bacterial cells.", "Pathogens are neutralized by the direct binding of antibodies without phagocytosis.", "Immune cells release cytokines to promote inflammation at the site of infection.", "Proteins bind to pathogen surfaces, enhancing the ability of phagocytes to engulf them.", "Antibodies bind to infected cells to prevent viral replication."], "answer": 3, "explanation": "Opsonins coat a pathogen and improve recognition and engulfment by phagocytes.", "learningObjectives": [15, 38], "topic": "Opsonization"}, {"id": 14, "type": "single", "prompt": "All of the following are examples of MAMPs (or PAMPs) found in Bacteria EXCEPT: (L.O. 31.22)", "options": ["LPS", "Peptidoglycan", "Lipoteichoic acids", "Braun's lipoproteins", "All of the above are examples of MAMPs and PAMPs."], "answer": 4, "explanation": "All four listed bacterial structures are examples of MAMPs/PAMPs.", "learningObjectives": [22], "topic": "Bacterial MAMPs/PAMPs"}, {"id": 15, "type": "single", "prompt": "TLRs: (L.O. 31.22, 31.23)", "options": ["Are part of the adaptive immune response", "Can be used to help release inflammatory cytokines", "Can only be found on the outside of phagocytic cells", "Are an example of a MAMP", "Are primarily found on the surface of T cells"], "answer": 1, "explanation": "Toll-like receptors are innate pattern-recognition receptors that can trigger inflammatory cytokine release.", "learningObjectives": [23], "topic": "Toll-like receptors"}, {"id": 16, "type": "sort", "prompt": "Two major types of cells present in adaptive immunity are B cells and T cells. Determine if the following best describes B cells, T cells, or both. (L.O. 32.6, 32.18, 32.39)", "categories": ["B cells", "T cells", "Both B and T cells"], "items": ["Mature in bone marrow", "Are called plasma cells after activation", "Can be used to secrete antibodies", "Production is continuous throughout life", "Mature in thymus", "Can be activated and differentiate into helper cells and cytotoxic cells", "Production is limited to thymus atrophying with age", "Originate as CD34+ stem cells", "Can be found in secondary lymphoid organs after encountering an antigen", "Lymphocytes AND leukocytes", "Can make memory cells"], "answer": {"B cells": ["Mature in bone marrow", "Are called plasma cells after activation", "Can be used to secrete antibodies", "Production is continuous throughout life"], "T cells": ["Mature in thymus", "Can be activated and differentiate into helper cells and cytotoxic cells", "Production is limited to thymus atrophying with age"], "Both B and T cells": ["Originate as CD34+ stem cells", "Can be found in secondary lymphoid organs after encountering an antigen", "Lymphocytes AND leukocytes", "Can make memory cells"]}, "explanation": "B and T cells share hematopoietic origins, lymphocyte identity, memory formation, and secondary lymphoid organ activity, but differ in maturation and effector functions.", "learningObjectives": [3, 18, 24, 39], "topic": "B cells versus T cells"}, {"id": 17, "type": "fill_multi", "prompt": "Fill in the blank. (L.O. 31.38, 31.39)", "parts": [["An ", " is any substance that can be recognized by the immune system and be used to “generate antibodies”. However, some antigens like ", " are too small to be recognized by the immune system and must attach to some carrier molecule to induce a response. On the other hand, an ", " is a substance that is recognized by the immune system AND elicits an immune response. These are ", " and ", " molecules."]], "answers": [["antigen", "haptens", "immunogen", "large", "complex"]], "explanation": "Antigens are recognized, haptens are too small alone, and immunogens are large, complex substances that elicit a response.", "learningObjectives": [7, 38], "topic": "Antigens, haptens, and immunogens"}, {"id": 18, "type": "matching", "prompt": "Antigens are antibody generators. That is, they stimulate the production of antibodies from B cells during the adaptive response. There are important terms we must discuss when we talk about antibodies and antigens. Match the following definitions. (L.O. 31.7, 31.39)", "rows": ["Avidity", "Paratopes", "Affinity", "Epitopes", "Valence"], "options": ["The overall strength of binding between an antigen and antibody", "The part of the antibody that binds to the antigen", "The strength of a single antigen-binding site interaction", "The part of the antigen recognized by an antibody", "The number of binding sites on an antigen or antibody"], "answer": [0, 1, 2, 3, 4], "explanation": "Avidity is overall binding strength; affinity is the strength of one site; paratopes are antibody binding sites; epitopes are antigenic sites; valence is the number of binding sites.", "learningObjectives": [7, 38, 39], "topic": "Avidity, affinity, epitopes, paratopes, and valence"}, {"id": 19, "type": "matching", "prompt": "Match the following types of specific immunity to the correct definition. (L.O. 32.26, 32.27)", "rows": ["Natural active immunity", "Artificial active immunity", "Artificial passive immunity", "Natural passive immunity"], "options": ["Producing your own immune cells via non-medical procedures", "Producing your own immune cells via medical procedures", "Having immune cells passed to you via medical procedures", "Having immune cells passed to you via non-medical procedures"], "answer": [0, 1, 2, 3], "explanation": "Active immunity involves producing your own response; passive immunity is transferred. Natural versus artificial distinguishes non-medical from medical acquisition.", "learningObjectives": [26, 27, 39], "topic": "Natural/artificial and active/passive immunity"}, {"id": 20, "type": "single", "prompt": "Which of the following is an example of natural passive immunity? (L.O. 32.26, 32.27)", "options": ["Vaccination with a live, attenuated virus", "Transfer of antibodies from mother to fetus via placenta", "Production of antibodies after exposure to COVID", "Activation of T cells from a strep throat infection", "Injection of antiserum from another individual"], "answer": 1, "explanation": "Placental transfer of maternal antibodies is natural passive immunity.", "learningObjectives": [26, 27], "topic": "Natural passive immunity"}, {"id": 21, "type": "sort_with_unused", "prompt": "As mentioned before, part of adaptive immunity is the recognition of the foreign self. This can be achieved through the major histocompatibility complex (MHC), which are used to present antigens to T cells. There are two classes of MHCs. Determine if the following best describes MHC I or MHC II. (L.O. 32.28, 32.29) Hint: Not every choice will be used!", "categories": ["MHC I", "MHC II", "Uncategorized answers"], "items": ["Binds to CD8 (cytotoxic) T cells", "Found in all nucleated cells, including APCs", "Endogenous antigen processing", "Occurs in the cytoplasm of the cell", "Exogenous antigen processing", "Found outside the cell", "Found in APCs", "Binds to CD4 (helper) T cells", "Found in erythrocytes (red blood cells)"], "answer": {"MHC I": ["Binds to CD8 (cytotoxic) T cells", "Found in all nucleated cells, including APCs", "Endogenous antigen processing", "Occurs in the cytoplasm of the cell"], "MHC II": ["Exogenous antigen processing", "Found outside the cell", "Found in APCs", "Binds to CD4 (helper) T cells"], "Uncategorized answers": ["Found in erythrocytes (red blood cells)"]}, "explanation": "MHC I presents endogenous cytoplasmic antigens to CD8 cells and is found on nucleated cells. MHC II presents exogenous antigens to CD4 cells and is found on APCs. Erythrocytes lack MHC.", "learningObjectives": [28, 29], "topic": "MHC I versus MHC II"}, {"id": 22, "type": "multi", "prompt": "Which of the following are examples of antigen presenting cells (APCs)? (Select all that apply) (L.O. 32.38)", "options": ["B cells", "Dendritic cells", "Eosinophils", "NK cells", "Macrophages"], "answer": [0, 1, 4], "explanation": "Professional APCs include B cells, dendritic cells, and macrophages.", "learningObjectives": [8, 38], "topic": "Antigen-presenting cells"}, {"id": 23, "type": "single", "prompt": "Which of the following statements about T-cell receptors (TCRs) is true? (L.O. 32.29)", "options": ["TCRs are found on both B cells and T cells.", "TCRs have intrinsic signaling domains that activate the T cell directly.", "TCRs are composed of two identical heavy chains.", "TCRs recognize antigens when presented by MHC molecules.", "Secreted TCRs bind to free-floating antigens."], "answer": 3, "explanation": "TCRs recognize peptide antigens presented by MHC molecules.", "learningObjectives": [29], "topic": "T-cell receptors"}, {"id": 24, "type": "single", "prompt": "During T-helper cell activation: (L.O. 32.8)", "options": ["CD28 is required to help produce an anergic cell.", "Helper T cells use either the perforin or CD95 pathway.", "B7 on T cells is required for T cell proliferation.", "Secreted TCRs bind to MHC II.", "The third signal differentiates naive and effector cells."], "answer": 4, "explanation": "The third signal, provided by cytokines, guides differentiation of activated T cells.", "learningObjectives": [8, 30], "topic": "T-helper cell activation"}, {"id": 25, "type": "matching", "prompt": "There are several types of T cells that can be activated when it encounters an antigen. Match the following types of T cells to their respective characteristic. (L.O. 32.30, 32.38)", "rows": ["TH1 (Helper T cell)", "TH2 (Helper T cell)", "TH17 (Helper T cell)", "Regulatory T cells", "Cytotoxic T cells"], "options": ["Activates macrophages", "Activates B cells", "Recruits neutrophils", "Regulates other cells; suppresses immune responses to prevent autoimmunity", "Kills infected or cancerous cells by releasing perforin and granzymes"], "answer": [0, 1, 2, 3, 4], "explanation": "TH1 activates macrophages, TH2 helps B cells, TH17 recruits neutrophils, Treg suppresses responses, and cytotoxic T cells kill target cells.", "learningObjectives": [30], "topic": "T-cell subsets"}, {"id": 26, "type": "tf", "prompt": "Superantigens are a type of exotoxin used by bacteria to trick T cells into activating and releasing massive quantities of inflammatory cytokines. (L.O. 32.37)", "answer": true, "explanation": "Superantigens cause broad T-cell activation and cytokine release.", "learningObjectives": [37], "topic": "Superantigens"}, {"id": 27, "type": "fill_multi", "prompt": "Fill in the blank. (L.O. 32.25, 32.31, 32.38)", "parts": [["After maturation and differentiation, B cells become ", " cells, which can be used to secrete antibodies. B cells can be activated in two main ways. In ", ", B cells require help from ", " to become fully activated, leading to class switching, affinity maturation, and memory formation. In contrast, ", " occurs when B cells are directly stimulated by repetitive antigens without the involvement of T cells."]], "answers": [["plasma", "T-dependent activation", "helper T cells (specifically TH2)", "T-independent activation"]], "explanation": "Activated B cells become plasma cells. T-dependent activation uses helper T-cell assistance, whereas T-independent activation does not.", "learningObjectives": [25, 31], "topic": "B-cell activation and plasma cells"}, {"id": 28, "type": "fill_multi", "prompt": "Fill in the blank. (L.O. 32.32)", "parts": [["Antibodies are ", " immunoglobulins composed of glycoproteins that serve as B-cell receptors (BCRs). Monomeric antibodies can be broken into 3 parts with a special enzyme called papain. There are 2 ", " components, which are used for antigen binding, and 1 ", " component, which is used for effector function."]], "answers": [["secreted", "Fab", "Fc (crystallizable)"]], "explanation": "Antibodies are secreted immunoglobulins; papain yields two Fab antigen-binding fragments and one Fc effector fragment.", "learningObjectives": [32], "topic": "Fab and Fc antibody fragments"}, {"id": 29, "type": "sort", "prompt": "There are five immunoglobulin classes: IgG, IgA, IgM, IgE, and IgD (GAMED). We will focus our discussion on IgG and IgM first. Determine if the following best describes IgG or IgM. (L.O. 32.34, 32.39)", "categories": ["IgG", "IgM"], "items": ["Requires 2 IgG molecules to activate the classical complement pathway", "Has 2 antigen-binding sites", "Has high affinity, low avidity", "Only immunoglobulin that can cross the placenta", "Monomer", "Has 4 subclasses", "Has low affinity, high avidity", "First immunoglobulin in all immune responses", "Pentamer", "Has 10 antigen-binding sites", "Requires 1 IgM molecule to activate the classical complement pathway"], "answer": {"IgG": ["Requires 2 IgG molecules to activate the classical complement pathway", "Has 2 antigen-binding sites", "Has high affinity, low avidity", "Only immunoglobulin that can cross the placenta", "Monomer", "Has 4 subclasses"], "IgM": ["Has low affinity, high avidity", "First immunoglobulin in all immune responses", "Pentamer", "Has 10 antigen-binding sites", "Requires 1 IgM molecule to activate the classical complement pathway"]}, "explanation": "IgG is a high-affinity monomer with two binding sites and four subclasses; IgM is a pentamer with high avidity and is produced first.", "learningObjectives": [34], "topic": "IgG versus IgM"}, {"id": 30, "type": "sort", "prompt": "Now, determine if the following best describes IgA, IgD, or IgE. (L.O. 32.34)", "categories": ["IgA", "IgD", "IgE"], "items": ["Can be formed as a monomer or dimer", "Secreted in tears, saliva, breast milk, and MALT", "Has 2 subclasses", "Found as BCR in mature B cells", "Plays a role in parasitic infection and allergic reactions", "Lowest in serum"], "answer": {"IgA": ["Can be formed as a monomer or dimer", "Secreted in tears, saliva, breast milk, and MALT", "Has 2 subclasses"], "IgD": ["Found as BCR in mature B cells"], "IgE": ["Plays a role in parasitic infection and allergic reactions", "Lowest in serum"]}, "explanation": "IgA is important in mucosal secretions, IgD functions as a B-cell receptor, and IgE participates in parasites and allergy.", "learningObjectives": [34], "topic": "IgA, IgD, and IgE"}, {"id": 31, "type": "fill_multi", "prompt": "Fill in the blank. (L.O. 32.4, 32.39)", "parts": [["In the primary antibody response, there is a lag period that lasts for several days. During this period, there is a ", " antibody titer because ", " antibody is detectable in blood. After this period, ", " will appear first followed by IgG. Switching from different antibodies is known as class switching or isotype switching. In the secondary antibody response, the B cells have a heightened memory response. There is characterized by a shorter ", " phase and more rapid ", " phase. There will also be a ", " IgG titer as well as the production of antibodies with ", " affinity. Antibodies can do a variety of functions; however, they are unable to perform ", "."]], "answers": [["low", "no", "IgM", "lag", "log", "higher", "higher", "cell lysis"]], "explanation": "Primary responses begin with a low titer and const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').trim().toLowerCase().replace(/[‐‑–—]/g,'-').replace(/\s+/g,' ');
function render(){quiz.innerHTML='';questions.forEach(q=>{const sec=document.createElement('section');sec.className='question';sec.dataset.id=q.id;sec.innerHTML=`<div class="qhead"><div><span class="qnum">Question ${q.id}</span><div>${esc(q.prompt)}</div></div><span class="type">${q.type.replaceAll('_',' ')}</span></div>`;const body=document.createElement('div');
if(q.type==='single'||q.type==='multi'){q.options.forEach((o,i)=>{const d=document.createElement('label');d.className='option';d.innerHTML=`<input type="${q.type==='single'?'radio':'checkbox'}" name="q${q.id}" value="${i}"><span>${esc(o)}</span>`;body.appendChild(d)})}
else if(q.type==='tf'){['True','False'].forEach(v=>{const d=document.createElement('label');d.className='option';d.innerHTML=`<input type="radio" name="q${q.id}" value="${v.toLowerCase()}"><span>${v}</span>`;body.appendChild(d)})}
else if(q.type==='fill'){
const d=document.createElement('div');d.className='fillline';
const sel=document.createElement('select');sel.className='inline-input';
sel.innerHTML='<option value="">Choose an answer</option>'+
(fillChoices[q.id]||[q.answers])[0].map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('');
d.appendChild(sel);body.appendChild(d)}
else if(q.type==='fill_multi'){q.parts.forEach((parts,pi)=>{
const d=document.createElement('div');d.className='fillline';
parts.forEach((part,idx)=>{d.appendChild(document.createTextNode(part));
if(idx<q.answers[pi].length){const sel=document.createElement('select');
sel.className='inline-input';sel.dataset.part=pi;sel.dataset.blank=idx;
const opts=(fillChoices[q.id]&&fillChoices[q.id][idx])||[q.answers[pi][idx]];
sel.innerHTML='<option value="">Choose an answer</option>'+
opts.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('');
d.appendChild(sel)}});body.appendChild(d)})}
else if(q.type==='matching'){q.rows.forEach((r,i)=>{const d=document.createElement('div');d.className='matchrow';d.innerHTML=`<label>${esc(r)}</label><select data-row="${i}"><option value="">Choose an answer</option>${q.options.map((o,j)=>`<option value="${j}">${esc(o)}</option>`).join('')}</select>`;body.appendChild(d)})}
else if(q.type==='sort'||q.type==='sort_with_unused'){const p=document.createElement('p');p.className='small';p.textContent='Drag each item into the correct category. On a phone, tap an item and then tap a category.';body.appendChild(p);const bank=document.createElement('div');bank.className='bank';bank.dataset.cat='Unsorted';bank.innerHTML='<b>Unsorted</b><br>';q.items.forEach(item=>{const b=document.createElement('button');b.type='button';b.className='chip';b.draggable=true;b.textContent=item;b.dataset.item=item;bank.appendChild(b)});body.appendChild(bank);const z=document.createElement('div');z.className='zones'+(q.categories.length===3?' three':'');q.categories.forEach(c=>{const d=document.createElement('div');d.className='zone';d.dataset.cat=c;d.innerHTML=`<b>${esc(c)}</b><br>`;z.appendChild(d)});body.appendChild(z)}
sec.appendChild(body);const fb=document.createElement('div');fb.className='feedback';sec.appendChild(fb);quiz.appendChild(sec)});bindSort();updateAnswered()}
let selected=null;let lastResults=null;function bindSort(){document.querySelectorAll('.chip').forEach(ch=>{ch.addEventListener('dragstart',e=>{selected=ch;e.dataTransfer.setData('text/plain',ch.dataset.item)});ch.addEventListener('click',()=>{selected=ch;document.querySelectorAll('.chip').forEach(x=>x.style.outline='');ch.style.outline='2px solid var(--accent)'})});document.querySelectorAll('.bank,.zone').forEach(z=>{z.addEventListener('dragover',e=>e.preventDefault());z.addEventListener('drop',e=>{e.preventDefault();if(selected){z.appendChild(selected);selected.style.outline='';selected=null;updateAnswered()}});z.addEventListener('click',e=>{if(selected&&!e.target.classList.contains('chip')){z.appendChild(selected);selected.style.outline='';selected=null;updateAnswered()}})})}
function answered(q,sec){if(q.type==='single'||q.type==='tf')return!!sec.querySelector('input:checked');if(q.type==='multi')return sec.querySelectorAll('input:checked').length>0;if(q.type==='fill')return sec.querySelector('select').value!=='';if(q.type==='fill_multi')return[...sec.querySelectorAll('select')].every(x=>x.value!=='');if(q.type==='matching')return[...sec.querySelectorAll('select')].every(x=>x.value!=='');if(q.type.startsWith('sort'))return sec.querySelector('[data-cat="Unsorted"] .chip')===null}
function updateAnswered(){document.getElementById('answered').textContent=`${questions.filter(q=>answered(q,document.querySelector(`[data-id="${q.id}"]`))).length}/${questions.length}`}
document.addEventListener('change',updateAnswered);document.addEventListener('input',updateAnswered);const same=(a,b)=>a.length===b.length&&a.every((v,i)=>v===b[i]);
function acceptable(expected,actual){const a=norm(actual),e=norm(expected);if(a===e)return true;const aliases={"β-1,4 glycosidic bonds":["b-1,4 glycosidic bonds","beta-1,4 glycosidic bonds","beta 1,4 glycosidic bonds"],"helper t cells (specifically th2)":["helper t cells","th2","th2 cells"],"fc (crystallizable)":["fc","fc crystallizable"],"cd4 (helper)":["cd4","cd4 helper","cd4 t cells","cd4 helper t cells"]};return(aliases[expected]||[]).map(norm).includes(a)}
function grade(){let total=0;const results=[];questions.forEach(q=>{const sec=document.querySelector(`[data-id="${q.id}"]`);let ok=false;if(q.type==='single'){const c=sec.querySelector('input:checked');ok=!!c&&Number(c.value)===q.answer}else if(q.type==='multi'){const vals=[...sec.querySelectorAll('input:checked')].map(x=>Number(x.value)).sort((a,b)=>a-b);ok=same(vals,[...q.answer].sort((a,b)=>a-b))}else if(q.type==='tf'){const c=sec.querySelector('input:checked');ok=!!c&&((c.value==='true')===q.answer)}else if(q.type==='fill'){ok=q.answers.some(a=>acceptable(a,sec.querySelector('select').value))}else if(q.type==='fill_multi'){ok=q.answers.every((arr,pi)=>arr.every((a,bi)=>acceptable(a,sec.querySelector(`[data-part="${pi}"][data-blank="${bi}"]`).value)))}else if(q.type==='matching'){ok=same([...sec.querySelectorAll('select')].map(x=>x.value===''?null:Number(x.value)),q.answer)}else if(q.type.startsWith('sort')){ok=q.categories.every(c=>{const vals=[...sec.querySelector(`[data-cat="${c}"]`).querySelectorAll('.chip')].map(x=>x.dataset.item).sort();return same(vals,[...q.answer[c]].sort())})}sec.classList.remove('correct','incorrect');sec.classList.add(ok?'correct':'incorrect');if(ok)total++;results.push({id:q.id,ok,topic:q.topic,learningObjectives:q.learningObjectives});const fb=sec.querySelector('.feedback');fb.classList.add('show');fb.innerHTML=`<strong class="${ok?'good':'bad'}">${ok?'Correct':'Incorrect'}</strong><div>${esc(q.explanation)}</div>`});lastResults=results;document.getElementById('correct').textContent=`${total}/${questions.length}`;document.getElementById('score').textContent=`${Math.round(total/questions.length*100)}%`;document.getElementById('report').classList.remove('show');window.scrollTo({top:0,behavior:'smooth'})}

function generateReport(){
 if(!lastResults){alert('Grade the quiz first so the report can use this attempt.');return;}
 const missed=lastResults.filter(r=>!r.ok),report=document.getElementById('report');
