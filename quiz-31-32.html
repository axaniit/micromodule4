    async function loadQuiz() {
      try {
        const bytes = Uint8Array.from(
          atob(compressedQuiz),
          character => character.charCodeAt(0)
        );

        const stream = new Blob([bytes])
          .stream()
          .pipeThrough(new DecompressionStream("gzip"));

        const quizHtml = await new Response(stream).text();

        document.open();
        document.write(quizHtml);
        document.close();
      } catch (error) {
        document.getElementById("loading").innerHTML =
          "<strong>The quiz could not load.</strong><br>" +
          "Open this page in a current version of Safari, Chrome, Edge, or Firefox.";
        console.error(error);
      }
    }

    loadQuiz();
