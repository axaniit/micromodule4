<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chapters 31 + 32 Quiz</title>
</head>

<body>
  <p id="loading" style="font-family:system-ui;padding:24px">
    Loading Chapters 31 + 32 quiz…
  </p>

  <script>
    (async () => {
      try {
        const url =
          "https://raw.githubusercontent.com/axaniit/micromodule4/f1a5434be1d8ed18f1488aee4cf7bf78f9d450fb/quiz-31-32.html";

        let source = await (
          await fetch(url, { cache: "no-store" })
        ).text();

        if (
          !source.includes(
            "const quizHtml = await new Response(stream).text();"
          )
        ) {
          throw new Error("Original quiz loader not found");
        }

        const patch = `
<script>
(function () {
  const choices = {
    "2": [
      ["break", "build", "coat", "dissolve"],
      [
        "β-1,4 glycosidic bonds",
        "peptide bonds",
        "phosphodiester bonds",
        "α-1,6 glycosidic bonds"
      ],
      ["lower", "upper", "entire", "nasal"],
      [
        "both hydrophobic and hydrophilic regions",
        "only hydrophobic regions",
        "only hydrophilic regions",
        "no charged regions"
      ]
    ],

    "11": [
      [
        "mature and differentiate",
        "encounter the antigen",
        "produce antibodies",
        "undergo phagocytosis"
      ],
      ["T cells", "B cells", "NK cells", "macrophages"],
      [
        "mature",
        "encounter the antigen",
        "secrete antibodies",
        "activate complement"
      ],
      ["B cells", "T cells", "NK cells", "neutrophils"],
      [
        "mature",
        "encounter the antigen",
        "secrete antibodies",
        "activate complement"
      ],
      [
        "encounter the antigen",
        "mature and differentiate",
        "leave the bloodstream",
        "undergo apoptosis"
      ]
    ],

    "12": [
      ["top", "bottom", "middle", "outside"]
    ],

    "17": [
      ["antigen", "antibody", "immunogen", "hapten"],
      ["haptens", "immunogens", "epitopes", "paratopes"],
      ["immunogen", "antigen", "hapten", "antibody"],
      ["large", "small", "simple", "lipid-only"],
      ["complex", "simple", "identical", "non-biological"]
    ],

    "27": [
      ["plasma", "memory", "helper T", "cytotoxic T"],
      [
        "T-dependent activation",
        "T-independent activation",
        "clonal deletion",
        "opsonization"
      ],
      [
        "helper T cells (specifically TH2)",
        "cytotoxic T cells",
        "neutrophils",
        "NK cells"
      ],
      [
        "T-independent activation",
        "T-dependent activation",
        "class switching",
        "affinity maturation"
      ]
    ],

    "28": [
      ["secreted", "membrane-only", "intracellular", "enzymatic"],
      ["Fab", "Fc", "hinge", "light-chain"],
      ["Fc (crystallizable)", "Fab", "hinge", "paratope"]
    ],

    "31": [
      ["low", "high", "unchanged", "maximum"],
      ["no", "IgG", "IgM", "IgA"],
      ["IgM", "IgG", "IgA", "IgE"],
      ["lag", "log", "stationary", "death"],
      ["log", "lag", "stationary", "death"],
      ["higher", "lower", "unchanged", "absent"],
      ["higher", "lower", "unchanged", "zero"],
      ["cell lysis", "neutralization", "agglutination", "opsonization"]
    ],

    "33": [
      ["Primary", "Acquired", "Adaptive", "Passive"],
      ["Acquired", "Primary", "Innate", "Active"],
      ["CD4 (helper)", "CD8 (cytotoxic)", "B", "NK"]
    ]
  };

  Object.entries(choices).forEach(([questionId, answerSets]) => {
    const section = document.querySelector(
      '[data-id="' + questionId + '"]'
    );

    if (!section) {
      return;
    }

    const inputs = [
      ...section.querySelectorAll('input[type="text"]')
    ];

    inputs.forEach((input, index) => {
      const select = document.createElement("select");

      select.className = input.className || "inline-input";

      select.innerHTML =
        '<option value="">Choose an answer</option>' +
        answerSets[index]
          .map(value => {
            const safeValue = String(value)
              .replace(/&/g, "&amp;")
              .replace(/</g, "&lt;")
              .replace(/"/g, "&quot;");

            return (
              '<option value="' +
              safeValue +
              '">' +
              value +
              "</option>"
            );
          })
          .join("");

      select.addEventListener("change", () => {
        input.value = select.value;

        input.dispatchEvent(
          new Event("input", { bubbles: true })
        );

        input.dispatchEvent(
          new Event("change", { bubbles: true })
        );
      });

      input.style.display = "none";
      input.parentNode.insertBefore(select, input);
    });
  });
})();
<\/script>
`;

        source = source.replace(
          "const quizHtml = await new Response(stream).text();",
          "let quizHtml = await new Response(stream).text();" +
          "quizHtml = quizHtml.replace('</body>', patch + '</body>');"
        );

        source = source.replace(
          "const compressedQuiz =",
          "const patch=" +
            JSON.stringify(patch) +
            "; const compressedQuiz ="
        );

        document.open();
        document.write(source);
        document.close();
      } catch (error) {
        document.getElementById("loading").innerHTML =
          "<strong>The quiz could not load.</strong><br>" +
          "Make sure you are connected to the internet, then refresh the page.";

        console.error(error);
      }
    })();
  </script>
</body>
</html>
