<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chapter 34 — Pathogenicity and Infection Practice Quiz</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1f2937;--muted:#64748b;--border:#d8dee8;--accent:#2563eb;--good:#157347;--bad:#b42318;--soft:#eef4ff}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:900px;margin:auto;padding:24px 16px 60px}.top{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
h1{font-size:1.55rem;margin:0 0 4px}.sub{color:var(--muted);margin:0}
.stats{display:grid;grid-template-columns:repeat(3,minmax(110px,1fr));gap:10px;margin:20px 0}.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px}.stat b{display:block;font-size:1.25rem}
.question{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;margin:14px 0}.question.correct{border-color:var(--good)}.question.incorrect{border-color:var(--bad)}
.qhead{display:flex;justify-content:space-between;gap:12px}.qnum{font-weight:700}.type{font-size:.86rem;color:var(--muted)}
.option{display:flex;gap:10px;align-items:flex-start;margin:10px 0}.option input{margin-top:5px}
select,input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:white;font:inherit}
.matchrow{margin:12px 0}.matchrow label{display:block;font-weight:600;margin-bottom:5px}
.fillline{margin:10px 0}.inline-input{display:inline-block;width:180px;max-width:100%;margin:0 5px}
button{border:1px solid var(--border);border-radius:11px;padding:10px 14px;font:inherit;font-weight:650;background:#fff;cursor:pointer}
.primary{background:var(--accent);border-color:var(--accent);color:white}.toolbar{display:flex;gap:10px;flex-wrap:wrap}
.feedback{display:none;margin-top:14px;padding:12px;border-radius:11px;background:#f8fafc}.feedback.show{display:block}.feedback strong.good{color:var(--good)}.feedback strong.bad{color:var(--bad)}
.bank,.zone{min-height:88px;border:2px dashed var(--border);border-radius:12px;padding:10px;margin:10px 0}.zones{display:grid;grid-template-columns:1fr 1fr;gap:12px}.chip{display:inline-block;margin:5px;padding:8px 10px;border:1px solid var(--border);border-radius:999px;background:white;cursor:grab}
.small{font-size:.9rem;color:var(--muted)}
.report{display:none;background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin:18px 0}
.report.show{display:block}.report h2{margin-top:0}.report-item{border-top:1px solid var(--border);padding:12px 0}.report-item:first-child{border-top:0}
.report ul{padding-left:22px}.all-good{color:var(--good);font-weight:700}.sticky{position:sticky;bottom:0;background:rgba(245,246,248,.95);backdrop-filter:blur(6px);padding:12px 0;margin-top:16px}
@media(max-width:650px){.zones{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.inline-input{display:block;width:100%;margin:6px 0}}
</style>
</head>
<body>
<main>
<div class="top">
  <div><h1>Chapter 34 — Pathogenicity and Infection</h1><p class="sub">27-question self-grading practice quiz</p></div>
  <div class="toolbar"><button id="reset">Reset</button><button class="primary" id="gradeTop">Grade quiz</button></div>
</div>
<div class="stats">
  <div class="stat"><span class="small">Answered</span><b id="answered">0/27</b></div>
  <div class="stat"><span class="small">Correct</span><b id="correct">—</b></div>
  <div class="stat"><span class="small">Score</span><b id="score">—</b></div>
</div>
<div id="quiz"></div>
<div id="report" class="report"></div>
<div class="sticky"><button class="primary" id="gradeBottom">Grade quiz</button> <button id="generateReport">Generate report</button></div>
</main>
<script>
const questions = [{"id": 1, "type": "matching", "prompt": "Match each term with its correct definition.", "rows": ["Disease", "Infection", "Host", "Pathogen", "Symptoms", "Signs"], "options": ["Any change from a state of health to one in which the body may not be able to carry out normal function.", "The state of having a pathogen growing within or on an organism.", "An organism in which the pathogen grows within or on.", "Any entity that can cause disease.", "Subjective changes such as pain level.", "Objective changes that can be directly observed and measured."], "answer": [0, 1, 2, 3, 4, 5], "explanation": "Disease alters normal function; infection means a pathogen is growing in or on a host; symptoms are subjective and signs are observable.", "learningObjectives": [23], "topic": "Match each term with its correct definition."}, {"id": 2, "type": "single", "prompt": "Which statement correctly distinguishes pathogenicity and virulence?", "options": ["Pathogenicity describes the degree of harm, while virulence only indicates whether disease occurs.", "Pathogenicity describes a microbe’s ability to cause disease.", "Virulence describes the degree of harm that a microbe can inflict on the host.", "Both B and C."], "answer": 3, "explanation": "Pathogenicity is the ability to cause disease; virulence is the degree or intensity of pathogenicity.", "learningObjectives": [22], "topic": "Which statement correctly distinguishes pathogenicity and virulence?"}, {"id": 3, "type": "multi", "prompt": "Which statements about reservoirs are true? Select all that apply.", "options": ["Viruses can serve as a reservoir.", "A reservoir can serve as the site from which a source acquires the pathogen for transmission.", "A reservoir is the natural environmental location in which the pathogen normally resides.", "A reservoir cannot be inanimate.", "A reservoir can be animate."], "answer": [1, 2, 4], "explanation": "Reservoirs may be animate or inanimate locations in which a pathogen normally resides.", "learningObjectives": [23], "topic": "Which statements about reservoirs are true? Select all that apply."}, {"id": 4, "type": "single", "prompt": "Which statement about zoonoses is false?", "options": ["Zoonoses are infectious diseases transmitted from animals to humans.", "In zoonoses, animals cannot serve as a reservoir.", "Zoonoses can be facilitated by vectors.", "Both A and C.", "None of the above."], "answer": 1, "explanation": "Animals commonly serve as reservoirs for zoonotic pathogens.", "learningObjectives": [23], "topic": "Which statement about zoonoses is false?"}, {"id": 5, "type": "sort", "prompt": "Sort each method of transmission into Direct or Indirect transmission.", "categories": ["Direct transmission", "Indirect transmission"], "items": ["Horizontal contact", "Vertical contact", "Airborne droplets", "Airborne— aerosolized particles and droplet nuclei", "Vector", "Food, water, and biological products", "Fomites"], "answer": {"Direct transmission": ["Horizontal contact", "Vertical contact", "Airborne droplets"], "Indirect transmission": ["Airborne— aerosolized particles and droplet nuclei", "Vector", "Food, water, and biological products", "Fomites"]}, "explanation": "This key uses the standard short-range droplet classification: droplets are direct; aerosols, vehicles, fomites, and vectors are indirect.", "learningObjectives": [23], "topic": "Sort each method of transmission into Direct or Indirect transmission."}, {"id": 6, "type": "single", "prompt": "Which statement about ID₅₀ and LD₅₀ is correct?", "options": ["ID₅₀ is the number of microbes required to cause disease in 50% of inoculated hosts.", "LD₅₀ is the number of pathogens that kills exactly 50 experimental subjects.", "ID₅₀ is always directly proportional to LD₅₀.", "Both A and C.", "All of the above."], "answer": 0, "explanation": "ID₅₀ infects 50% of hosts. LD₅₀ kills 50% of a group, not exactly 50 individuals.", "learningObjectives": [10], "topic": "Which statement about ID₅₀ and LD₅₀ is correct?"}, {"id": 7, "type": "multi", "prompt": "Based on an LD₅₀ graph where Bacteria 1 reaches 50% mortality at a lower dose than Bacteria 2, which statements are true?", "options": ["Bacteria 1 is more lethal than Bacteria 2.", "Bacteria 2 has the lower LD₅₀.", "Removing Bacteria 1’s capsule would decrease its LD₅₀.", "Bacteria 2 requires approximately 10⁶ cells to kill 50% of the experimental group.", "Bacteria 1 has a lower ID₅₀ than Bacteria 2."], "answer": [0, 3], "explanation": "A lower LD₅₀ indicates greater lethality. An LD₅₀ graph does not provide ID₅₀ values.", "learningObjectives": [10], "topic": "Based on an LD₅₀ graph where Bacteria 1 reaches 50% mortality at a lower dose than Bacteria 2, which statements are true?"}, {"id": 8, "type": "multi", "prompt": "Which statements about pathogen growth locations are true? Select all that apply.", "options": ["Viruses are obligate intracellular pathogens.", "Obligate intracellular pathogens are incapable of growing outside host cells.", "Extracellular pathogens remain in tissues and fluids but do not enter host cells.", "Facultative intracellular pathogens can live within a host but can also be grown in pure culture.", "Resident microbiota can become opportunistic pathogens when the host is weakened or when the microbe is moved from its normal niche."], "answer": [0, 1, 2, 3, 4], "explanation": "All five statements are consistent with the definitions of extracellular, facultative intracellular, obligate intracellular, and opportunistic pathogens.", "learningObjectives": [23], "topic": "Which statements about pathogen growth locations are true? Select all that apply."}, {"id": 9, "type": "single", "prompt": "Which statement about tropism is correct?", "options": ["A microbe’s tropism depends on interactions between its surface structures and host receptors.", "Tropism is a pathogen’s tendency to infect particular cell types.", "Mutations in a virus genome can change its tropism.", "All of the above."], "answer": 3, "explanation": "Tropism reflects receptor compatibility and can change when pathogen surface proteins change.", "learningObjectives": [22], "topic": "Which statement about tropism is correct?"}, {"id": 10, "type": "tf", "prompt": "Pathogenicity islands are DNA segments that encode virulence factors.", "answer": true, "explanation": "Pathogenicity islands commonly contain clusters of virulence genes and are often acquired through horizontal gene transfer.", "learningObjectives": [7, 8], "topic": "Pathogenicity islands are DNA segments that encode virulence factors."}, {"id": 11, "type": "single", "prompt": "Which of the following can be considered a virulence factor?", "options": ["Capsule", "Flagella", "Pili", "All of the above"], "answer": 3, "explanation": "Capsules aid immune evasion, flagella aid motility, and pili aid adherence.", "learningObjectives": [11, 18], "topic": "Which of the following can be considered a virulence factor?"}, {"id": 12, "type": "matching", "prompt": "Match each exoenzyme with its function.", "rows": ["Coagulase", "Collagenase", "Lipase", "Fibrinolysin", "Hyaluronidase"], "options": ["Facilitates clot formation to protect the pathogen from host defenses.", "Breaks down connective-tissue collagen and aids spread.", "Breaks down lipids and can contribute to abscess formation.", "Breaks down fibrin clots and permits pathogen movement.", "Hydrolyzes hyaluronic acid that helps cement cells together."], "answer": [0, 1, 2, 3, 4], "explanation": "Coagulase forms clots; fibrinolysin dissolves them; collagenase, lipase, and hyaluronidase break down host tissue components.", "learningObjectives": [11], "topic": "Match each exoenzyme with its function."}, {"id": 13, "type": "matching", "prompt": "Match each factor with its action.", "rows": ["Hemolysins", "Phospholipase and lecithinase", "Leukocidins"], "options": ["Lyse red blood cells", "Break down phospholipids", "Form pores in or kill leukocytes"], "answer": [0, 1, 2], "explanation": "Hemolysins target red blood cells; phospholipases attack membrane phospholipids; leukocidins target white blood cells.", "learningObjectives": [2, 11], "topic": "Match each factor with its action."}, {"id": 14, "type": "single", "prompt": "Which statement about virulence and invasiveness is correct?", "options": ["Clostridium tetani can be highly virulent while remaining relatively non-invasive.", "Bacillus anthracis can be both virulent and highly invasive.", "Yersinia pestis is not virulent but is highly invasive.", "Both A and B.", "All of the above."], "answer": 3, "explanation": "Tetanus disease is largely toxin-mediated and localized, while anthrax can be both highly virulent and invasive.", "learningObjectives": [14], "topic": "Which statement about virulence and invasiveness is correct?"}, {"id": 15, "type": "single", "prompt": "Which statement about adherence and invasion is correct?", "options": ["Pathogens can gain entry through a portal of entry.", "Specific interactions between pathogen adhesins and host receptors lead to adherence.", "Listeria monocytogenes can use actin polymerization to move between host cells.", "All of the above."], "answer": 3, "explanation": "All three are standard features of entry, adherence, or cell-to-cell spread.", "learningObjectives": [1, 22], "topic": "Which statement about adherence and invasion is correct?"}, {"id": 16, "type": "multi", "prompt": "Which statements describe exotoxins? Select all that apply.", "options": ["Exotoxins include AB toxins.", "Some exotoxins can be inactivated to form toxoids.", "They are generally soluble, heat-labile proteins.", "They can travel from an infection site to other tissues or cells and exert effects.", "They include lipid-based structures."], "answer": [0, 1, 2, 3], "explanation": "Exotoxins are secreted proteins. AB toxins are one exotoxin category, and some exotoxins can be converted into toxoids.", "learningObjectives": [3, 15, 23], "topic": "Which statements describe exotoxins? Select all that apply."}, {"id": 17, "type": "multi", "prompt": "Which statements about membrane-disrupting exotoxins and superantigens are true?", "options": ["Membrane-disrupting exotoxins can cause osmotic shifts that lead to cell lysis.", "Both superantigens and membrane-disrupting toxins must be internalized to function.", "Membrane-disrupting exotoxins destabilize bacterial peptidoglycan.", "Superantigens can stimulate approximately 30% of host B cells.", "Superantigens can induce cytokine storms."], "answer": [0, 4], "explanation": "Membrane toxins damage host membranes. Superantigens activate unusually large numbers of T cells, not B cells, and can trigger cytokine storms.", "learningObjectives": [2, 16], "topic": "Which statements about membrane-disrupting exotoxins and superantigens are true?"}, {"id": 18, "type": "multi", "prompt": "Select every FALSE statement about diphtheria toxin.", "options": ["It is an endotoxin.", "It inhibits mRNA transcription.", "It is an AB toxin whose B subunit catalyzes ADP-ribosylation of EF-2.", "It is produced by Corynebacterium diphtheriae after lysogenic conversion by bacteriophage β.", "It must bind a cognate host receptor for the active component to function."], "answer": [0, 1, 2], "explanation": "Diphtheria toxin is an AB exotoxin that inhibits translation. Its A subunit modifies EF-2; the B component mediates binding.", "learningObjectives": [3, 6, 15], "topic": "Select every FALSE statement about diphtheria toxin."}, {"id": 19, "type": "multi", "prompt": "Which statements correctly compare tetanus and botulinum toxins?", "options": ["Both can disrupt breathing and cause death by respiratory failure.", "Both Clostridium tetani and Clostridium botulinum release tetanolysin.", "Tetanus toxin prevents muscle contraction while botulinum toxin prevents muscle relaxation.", "They are neurotoxins but not exotoxins.", "Tetanus toxin blocks glycine release, while botulinum toxin blocks acetylcholine release."], "answer": [0, 4], "explanation": "Tetanus toxin causes continuous contraction by blocking inhibitory neurotransmitter release; botulinum toxin causes flaccid paralysis by blocking acetylcholine.", "learningObjectives": [15], "topic": "Which statements correctly compare tetanus and botulinum toxins?"}, {"id": 20, "type": "single", "prompt": "Which statement about Clostridium perfringens is correct?", "options": ["It is a fermenter that can cause gas gangrene.", "It germinates and grows in anoxic conditions and can release multiple toxins.", "Its toxins can break down muscle tissue.", "All of the above."], "answer": 3, "explanation": "C. perfringens grows rapidly under anaerobic conditions, produces gas, and releases tissue-damaging toxins.", "learningObjectives": [2, 15], "topic": "Which statement about Clostridium perfringens is correct?"}, {"id": 21, "type": "single", "prompt": "Which statement about enterotoxins is false?", "options": ["They can cause nausea, vomiting, and diarrhea.", "They can alter intestinal epithelial permeability.", "They are composed of carbohydrates but not proteins.", "None of the above."], "answer": 2, "explanation": "Enterotoxins are protein exotoxins, not carbohydrate-only structures.", "learningObjectives": [3, 21], "topic": "Which statement about enterotoxins is false?"}, {"id": 22, "type": "multi", "prompt": "Which statements about Clostridioides difficile are true? Select all that apply.", "options": ["C. difficile is an anaerobe.", "Its toxins can disrupt cytoskeletal structure and tight junctions in intestinal cells.", "It can cause antibiotic-associated diarrhea.", "Antibiotic use can increase the risk of C. difficile infection.", "Its toxins can damage intestinal cells and promote disease."], "answer": [0, 1, 2, 3, 4], "explanation": "C. difficile is an anaerobic gastrointestinal pathogen whose toxins damage the cytoskeleton, tight junctions, and intestinal tissue.", "learningObjectives": [2, 15, 21], "topic": "Which statements about Clostridioides difficile are true? Select all that apply."}, {"id": 23, "type": "multi", "prompt": "Which statements about Vibrio cholerae and cholera toxin are true?", "options": ["The A subunit activates adenylate cyclase and decreases cAMP.", "Shellfish can serve as a natural reservoir for V. cholerae.", "Cholera toxin causes secretion of chloride and bicarbonate ions into the intestinal lumen.", "Cholera can cause massive loss of water and electrolytes.", "The toxin causes intestinal cells to massively absorb water from the lumen."], "answer": [1, 2, 3], "explanation": "Cholera toxin increases cAMP, drives ion secretion, and causes water to move into the intestinal lumen.", "learningObjectives": [3, 15, 21], "topic": "Which statements about Vibrio cholerae and cholera toxin are true?"}, {"id": 24, "type": "single", "prompt": "Which statement about pathogenic E. coli strains is correct?", "options": ["All ETEC enterotoxins are heat-labile.", "ETEC produces Stx-1 and Stx-2.", "STEC can lead to hemolytic uremic syndrome.", "Both A and B.", "All of the above."], "answer": 2, "explanation": "STEC/EHEC produces Shiga-like toxins and may cause HUS. ETEC produces heat-labile and/or heat-stable enterotoxins.", "learningObjectives": [3, 15], "topic": "Which statement about pathogenic E. coli strains is correct?"}, {"id": 25, "type": "multi", "prompt": "Which statements about endotoxin are true? Select all that apply.", "options": ["It can contribute to septic shock.", "It is not toxic in nanogram amounts.", "It is weakly immunogenic.", "LPS is called an endotoxin.", "Endotoxins are heat-stable."], "answer": [0, 2, 3, 4], "explanation": "Endotoxin is heat-stable, weakly immunogenic, toxic in tiny amounts, and associated with LPS—particularly lipid A.", "learningObjectives": [3, 17, 20, 23], "topic": "Which statements about endotoxin are true? Select all that apply."}, {"id": 26, "type": "matching", "prompt": "Match each fungus with its mycotoxin or toxin product.", "rows": ["Claviceps purpurea", "Aspergillus flavus", "Stachybotrys"], "options": ["Lysergic acid / LSD-related ergot alkaloids", "Aflatoxin", "Satratoxin"], "answer": [0, 1, 2], "explanation": "Claviceps produces ergot alkaloids, Aspergillus flavus produces aflatoxin, and Stachybotrys produces satratoxins.", "learningObjectives": [15, 22], "topic": "Match each fungus with its mycotoxin or toxin product."}, {"id": 27, "type": "multi", "prompt": "Which statements describe mechanisms used to resist or evade host defenses?", "options": ["Trypanosoma brucei can undergo VSG switching.", "HIV can infect immune cells and diminish their function.", "Rickettsia species can infect and replicate within host cells.", "Helicobacter pylori is an L-form bacterium that stops producing a plasma membrane.", "Cells infected by hepatitis B virus can produce decoy proteins that bind host antimicrobial or immune factors."], "answer": [0, 1, 2, 4], "explanation": "Antigen switching, infection of immune cells, intracellular survival, and decoy production all aid immune evasion. H. pylori is not an L-form organism.", "learningObjectives": [13], "topic": "Which statements describe mechanisms used to resist or evade host defenses?"}];
const quiz = document.getElementById('quiz');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function norm(s){return String(s||'').trim().toLowerCase().replace(/[‐‑–—]/g,'-').replace(/\s+/g,' ')}
function render(){
 quiz.innerHTML='';
 questions.forEach(q=>{
  const sec=document.createElement('section'); sec.className='question'; sec.dataset.id=q.id;
  sec.innerHTML=`<div class="qhead"><div><span class="qnum">Question ${q.id}</span><div>${esc(q.prompt)}</div></div><span class="type">${q.type.replace('_',' ')}</span></div>`;
  const body=document.createElement('div');
  if(q.type==='single'||q.type==='multi'){
   q.options.forEach((o,i)=>{const d=document.createElement('label');d.className='option';d.innerHTML=`<input type="${q.type==='single'?'radio':'checkbox'}" name="q${q.id}" value="${i}"><span>${esc(o)}</span>`;body.appendChild(d)})
  } else if(q.type==='tf'){
   ['True','False'].forEach(v=>{const d=document.createElement('label');d.className='option';d.innerHTML=`<input type="radio" name="q${q.id}" value="${v.toLowerCase()}"><span>${v}</span>`;body.appendChild(d)})
  } else if(q.type==='dropdown_multi'){
   let optionIndex=0;
   q.parts.forEach((parts,pi)=>{
    const d=document.createElement('div');d.className='fillline';
    parts.forEach((part,idx)=>{
     d.appendChild(document.createTextNode(part));
     if(idx<q.answers[pi].length){
      const sel=document.createElement('select');sel.className='inline-input';sel.dataset.part=pi;sel.dataset.blank=idx;
      sel.innerHTML='<option value="">Choose an answer</option>'+q.dropdownOptions[optionIndex].map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('');
      optionIndex++;d.appendChild(sel)
     }
    });body.appendChild(d)
   })
  } else if(q.type==='matching'){
   q.rows.forEach((r,i)=>{
    const d=document.createElement('div');d.className='matchrow';
    const shuffled=q.options.map((o,j)=>({o,j}));
    for(let k=shuffled.length-1;k>0;k--){
     const n=Math.floor(Math.random()*(k+1));
     [shuffled[k],shuffled[n]]=[shuffled[n],shuffled[k]]
    }
    d.innerHTML=`<label>${esc(r)}</label><select data-row="${i}"><option value="">Choose an answer</option>${shuffled.map(({o,j})=>`<option value="${j}">${esc(o)}</option>`).join('')}</select>`;
    body.appendChild(d)
   })
  } else if(q.type==='sort'){
   const p=document.createElement('p');p.className='small';p.textContent='Drag items into the correct category. On a phone, tap an item and then tap a category.';body.appendChild(p);
   const bank=document.createElement('div');bank.className='bank';bank.dataset.cat='Unsorted';bank.innerHTML='<b>Unsorted</b><br>';q.items.forEach(item=>{const b=document.createElement('button');b.type='button';b.className='chip';b.draggable=true;b.textContent=item;b.dataset.item=item;bank.appendChild(b)});body.appendChild(bank);
   const z=document.createElement('div');z.className='zones';q.categories.forEach(c=>{const d=document.createElement('div');d.className='zone';d.dataset.cat=c;d.innerHTML=`<b>${esc(c)}</b><br>`;z.appendChild(d)});body.appendChild(z)
  }
  sec.appendChild(body);const fb=document.createElement('div');fb.className='feedback';sec.appendChild(fb);quiz.appendChild(sec)
 });
 bindSort(); updateAnswered();
}
let selected=null;
let lastResults=null;
function bindSort(){
 document.querySelectorAll('.chip').forEach(ch=>{
  ch.addEventListener('dragstart',e=>{selected=ch;e.dataTransfer.setData('text/plain',ch.dataset.item)});
  ch.addEventListener('click',()=>{selected=ch;document.querySelectorAll('.chip').forEach(x=>x.style.outline='');ch.style.outline='2px solid var(--accent)'})
 });
 document.querySelectorAll('.bank,.zone').forEach(z=>{
  z.addEventListener('dragover',e=>e.preventDefault());
  z.addEventListener('drop',e=>{e.preventDefault();if(selected){z.appendChild(selected);selected.style.outline='';selected=null;updateAnswered()}});
  z.addEventListener('click',e=>{if(selected&&!e.target.classList.contains('chip')){z.appendChild(selected);selected.style.outline='';selected=null;updateAnswered()}})
 });
}
function answered(q,sec){
 if(q.type==='single'||q.type==='tf')return !!sec.querySelector('input:checked');
 if(q.type==='multi')return sec.querySelectorAll('input:checked').length>0;
 if(q.type==='dropdown_multi')return [...sec.querySelectorAll('select')].every(x=>x.value!=='');
 if(q.type==='matching')return [...sec.querySelectorAll('select')].every(x=>x.value!=='');
 if(q.type==='sort')return sec.querySelector('[data-cat="Unsorted"] .chip')===null;
}
function updateAnswered(){document.getElementById('answered').textContent=`${questions.filter(q=>answered(q,document.querySelector(`[data-id="${q.id}"]`))).length}/${questions.length}`}
document.addEventListener('change',updateAnswered);document.addEventListener('input',updateAnswered);
function same(a,b){return a.length===b.length&&a.every((v,i)=>v===b[i])}
function grade(){
 let total=0;
 const results=[];
 questions.forEach(q=>{
  const sec=document.querySelector(`[data-id="${q.id}"]`);let ok=false;
  if(q.type==='single'){const c=sec.querySelector('input:checked');ok=!!c&&Number(c.value)===q.answer}
  else if(q.type==='multi'){const vals=[...sec.querySelectorAll('input:checked')].map(x=>Number(x.value)).sort((a,b)=>a-b);ok=same(vals,[...q.answer].sort((a,b)=>a-b))}
  else if(q.type==='tf'){const c=sec.querySelector('input:checked');ok=!!c&&((c.value==='true')===q.answer)}
  else if(q.type==='dropdown_multi'){ok=q.answers.every((arr,pi)=>arr.every((a,bi)=>norm(a)===norm(sec.querySelector(`[data-part="${pi}"][data-blank="${bi}"]`).value)))}
  else if(q.type==='matching'){ok=same([...sec.querySelectorAll('select')].map(x=>x.value===''?null:Number(x.value)),q.answer)}
  else if(q.type==='sort'){ok=q.categories.every(c=>{const vals=[...sec.querySelector(`[data-cat="${c}"]`).querySelectorAll('.chip')].map(x=>x.dataset.item).sort();return same(vals,[...q.answer[c]].sort())})}
  sec.classList.remove('correct','incorrect');sec.classList.add(ok?'correct':'incorrect');if(ok)total++;results.push({id:q.id,ok,topic:q.topic,learningObjectives:q.learningObjectives});
  const fb=sec.querySelector('.feedback');fb.classList.add('show');fb.innerHTML=`<strong class="${ok?'good':'bad'}">${ok?'Correct':'Incorrect'}</strong><div>${esc(q.explanation)}</div>`;
 });
 lastResults=results;document.getElementById('correct').textContent=`${total}/${questions.length}`;document.getElementById('score').textContent=`${Math.round(total/questions.length*100)}%`;document.getElementById('report').classList.remove('show');window.scrollTo({top:0,behavior:'smooth'})
}

const learningObjectiveText={"1": "Describe how bacterial pathogens adhere to and penetrate host tissues and defenses.", "2": "Describe how bacterial pathogens damage host tissues.", "3": "Explain the role of bacterial endo- and exotoxins in pathogenesis.", "5": "Summarize microbial mechanisms of pathogenicity.", "6": "Explain the role phages and plasmids may play in pathogenicity.", "7": "Discuss what a pathogenicity island is.", "8": "Describe the role of horizontal gene transfer in pathogenicity.", "10": "Compare two bacterial strains with different LD50 and ID50 values.", "11": "List the virulence factors discussed in lecture, their functions, and bacteria that may use them.", "13": "List the different ways that bacteria evade the immune system.", "14": "Discuss different levels of invasion among bacteria.", "15": "List the exotoxins discussed, their signs and symptoms, and the bacteria that make them.", "16": "Explain how superantigens work and their possible outcomes.", "17": "Discuss why endotoxins do not produce specific signs and symptoms.", "18": "Discuss why capsules, flagella, and pili are considered virulence factors.", "20": "List toxins that may lead to septic shock and the signs and symptoms of septic shock.", "21": "Compare different ways to acquire enterotoxins.", "22": "Define and explain pathogenicity, virulence factors, tropism, actin rockets, AB toxins, superantigens, enterotoxins, and mycotoxins.", "23": "Compare and contrast endotoxin vs. exotoxin, antitoxin vs. toxoid, signs vs. symptoms, infection vs. disease, direct vs. indirect transmission, and extracellular vs. intracellular pathogens."};
function generateReport(){
 if(!lastResults){alert('Grade the quiz first so the report can use this attempt.');return;}
 const missed=lastResults.filter(r=>!r.ok),report=document.getElementById('report');
 if(!missed.length){report.innerHTML='<h2>Learning report</h2><p class="all-good">You answered every question correctly on this attempt. No learning objectives were flagged for review.</p>';report.classList.add('show');report.scrollIntoView({behavior:'smooth'});return;}
 const grouped={};missed.forEach(r=>r.learningObjectives.forEach(lo=>{(grouped[lo]??=[]).push(r)}));
 const loHtml=Object.keys(grouped).sort((a,b)=>a-b).map(lo=>`<div class="report-item"><strong>Pathogenicity LO ${lo}</strong><div>${esc(learningObjectiveText[lo])}</div><div class="small">Flagged by: ${grouped[lo].map(q=>`Question ${q.id} — ${esc(q.topic)}`).join('; ')}</div></div>`).join('');
 const qHtml=missed.map(r=>`<li><strong>Question ${r.id}:</strong> ${esc(r.topic)} <span class="small">(LO ${r.learningObjectives.join(', ')})</span></li>`).join('');
 report.innerHTML=`<h2>Learning report</h2><p>You missed <strong>${missed.length}</strong> of ${questions.length} questions on this attempt.</p><h3>Learning objectives to review</h3>${loHtml}<h3>Questions and topics to revisit</h3><ul>${qHtml}</ul>`;
 report.classList.add('show');report.scrollIntoView({behavior:'smooth'});
}

document.getElementById('gradeTop').addEventListener('click',grade);document.getElementById('gradeBottom').addEventListener('click',grade);document.getElementById('generateReport').addEventListener('click',generateReport);
document.getElementById('reset').addEventListener('click',()=>{render();lastResults=null;document.getElementById('correct').textContent='—';document.getElementById('score').textContent='—';document.getElementById('report').classList.remove('show');window.scrollTo({top:0,behavior:'smooth'})});
render();
</script>
